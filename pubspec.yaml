name: flame_surge
description: "Flame Surge - a volcanic placement puzzle."
publish_to: 'none'

version: 1.0.1+3

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: 1.0.8

  # Networking / storage
  http: 1.3.0
  shared_preferences: 2.5.2
  # Bumped from 9.2.4 to satisfy pitfalls §19 floor (10.x has 16 KB alignment
  # for Android + Keystore reliability fixes).
  flutter_secure_storage: 10.3.1
  connectivity_plus: 6.1.5
  device_info_plus: 11.4.0
  package_info_plus: 8.3.0
  path_provider: 2.1.5

  # UI helpers
  video_player: 2.9.5
  url_launcher: 6.3.2
  webview_flutter: 4.14.0
  webview_flutter_android: 4.13.0

  # File selector inside WebView (do NOT bump past 8.x — see gray-part
  # pitfalls doc: 10+ ships a Kotlin-only plugin that clashes with
  # Flutter's built-in KGP and breaks GeneratedPluginRegistrant).
  file_picker: 8.1.4

  # Attribution / push
  #
  # appsflyer_sdk 6.18.0 – MUST be >= 6.16.0 per pitfalls §19: 6.15.x has
  # a documented Organic false-positive on `onInstallConversionData` that
  # makes non-organic OneLink installs land in the arena instead of the
  # portal. Also includes the 16 KB page-size alignment.
  appsflyer_sdk: 6.18.0
  firebase_core: 3.15.2
  firebase_messaging: 15.2.10
  firebase_app_check: 0.3.2+10
  flutter_local_notifications: 18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
  flutter_launcher_icons: 0.14.4

flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/AppIcon.png"
  min_sdk_android: 24
  adaptive_icon_background: "#FF120704"
  adaptive_icon_foreground: "assets/AppIcon.png"
  adaptive_icon_foreground_inset: 0
  remove_alpha_ios: false

flutter:
  uses-material-design: true
  assets:
    - assets/AppIcon.png
    - assets/Icon.png
    - assets/Game_Name.webp
    - assets/Horizontal_Loading_Screen.webp
    - assets/Vertical_Loading_Screen.webp
    - assets/Horizontal_Notifications_Screen.webp
    - assets/Vertical_Notifications_Screen.webp
    - assets/no_wifi_screen_hor.png
    - assets/Vertical_Nowifi_Screen.webp
    - assets/basalt_boulder_asset.webp
    - assets/bg1_asset.webp
    - assets/bg2_asset.webp
    - assets/bg3_asset.webp
    - assets/crystal_cluster_asset.webp
    - assets/fire_flower_asset.webp
    - assets/lava_mushroom_asset.webp
    - assets/lava_plant_asset.webp
    - assets/magma_crystal_asset.webp
    - assets/molten_lava_asset.webp
    - assets/obsidian_pillar_asset.webp
    - assets/obsidian_rock_asset.webp
    - assets/volcanic_magma_vent_asset.webp
    - assets/volcanic_rock_asset.webp
    - assets/volcanic_shrub_asset.webp
    - assets/volcanic_terrain_tile_asset.webp
    - assets/volcanic_terrain_tile_blocked_asset.webp
